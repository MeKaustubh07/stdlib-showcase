<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linear Algebra Playground — stdlib BLAS Showcase</title>
  <meta name="description" content="Interactive visualizations of BLAS operations powered by stdlib. Explore matrix-vector multiply, Givens rotations, vector operations, and performance benchmarks." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Hero -->
    <header class="hero">
      <div class="hero-bg"></div>
      <div class="hero-content">
        <span class="hero-badge">@stdlib/blas</span>
        <h1>Linear Algebra <span class="gradient-text">Playground</span></h1>
        <p class="hero-subtitle">Interactive visualizations of BLAS operations — the building blocks of scientific computing</p>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-nav" id="tabNav">
      <button class="tab-btn active" data-section="gemv">
        <span class="tab-icon">⊗</span>
        <span class="tab-label">Matrix × Vector</span>
        <span class="tab-sub">SGEMV</span>
      </button>
      <button class="tab-btn" data-section="rotation">
        <span class="tab-icon">↻</span>
        <span class="tab-label">Givens Rotation</span>
        <span class="tab-sub">SROTG + SROT</span>
      </button>
      <button class="tab-btn" data-section="vectors">
        <span class="tab-icon">⟨·⟩</span>
        <span class="tab-label">Vector Ops</span>
        <span class="tab-sub">SAXPY · SDOT · SSCAL</span>
      </button>
    </nav>

    <!-- Sections -->
    <main class="sections-container">
      <section class="section active" id="section-gemv"></section>
      <section class="section" id="section-rotation"></section>
      <section class="section" id="section-vectors"></section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Built with <a href="https://github.com/stdlib-js/stdlib" target="_blank">stdlib</a> · BLAS Level 1–3 Routines</p>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
